    env_file:
      - .env
    volumes:
      - ./data:/app/data
    # Optional: Add healthcheck
    # healthcheck:
    #   test: ["CMD", "python", "-c", "print('ok')"]
    #   interval: 60s
    #   timeout: 10s
    #   retries: 3

volumes:
  botdata:
    name: otc-bot-data

